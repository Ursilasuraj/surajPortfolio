# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch.
  #
  # Pages publishes ONE site, from whichever branch is named here.
  #
  # If a deployment is attempted from a branch the github-pages environment
  # does not permit, it is not rejected — it sits queued until
  # actions/deploy-pages times out after ~10 minutes. Because the job holds
  # the "pages" concurrency group below with cancel-in-progress: false, that
  # stuck run then blocks every later run too. If deploys start hanging,
  # cancel the stuck run first, then check
  # Settings → Environments → github-pages → Deployment branches
  # and make sure the branch named below is allowed.
  push:
    branches: ["portfolioProfileReview"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
