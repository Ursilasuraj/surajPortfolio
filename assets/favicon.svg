<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="S">
  <title>Suraj Plachikaad Suresh Kumar</title>
  <rect width="64" height="64" rx="6" fill="#1B1A17"/>
  <!-- An S-curve that doubles as a winding road — drawn as a path rather than
       text so it renders identically everywhere, regardless of fonts. -->
